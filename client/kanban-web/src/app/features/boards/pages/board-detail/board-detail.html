<div class="board-detail">
  <header class="board-detail-header">
    <h1 class="board-detail-title">{{ board().name }}</h1>
    @if (board().description) {
      <p class="board-detail-description">{{ board().description }}</p>
    }
  </header>

  <div class="board-columns">
    @for (column of board().columns; track column.id) {
      <app-board-column [column]="column" />
    } @empty {
      <p class="board-detail-empty">This board has no columns yet.</p>
    }
  </div>
</div>
