name: Deploy Frontend Angular

on:
  push:
    branches:
      - main
    paths:
      - 'client/kanban-web/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/kanban-web/package-lock.json

      - name: Install dependencies
        working-directory: client/kanban-web
        run: npm ci

      - name: Build
        working-directory: client/kanban-web
        run: npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          skip_app_build: true
          app_location: 'client/kanban-web'
          output_location: 'dist/kanban-web/browser'
